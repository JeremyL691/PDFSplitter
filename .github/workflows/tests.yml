name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
  native:
    runs-on: macos-14
    env:
      PDFSPLITTER_NATIVE_TESTS: '1'
      PDFSPLITTER_CACHE_DIR: ${{ runner.temp }}/pdfsplitter-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python native/build.py
      - run: python -m unittest tests.test_core tests.test_recovery tests.test_native -v
